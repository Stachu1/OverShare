<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Discord Bot Test</title>
<style>
  body { font-family: system-ui, sans-serif; background: #1e1f22; color: #dbdee1; max-width: 560px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 20px; }
  label { display: block; margin: 14px 0 4px; font-size: 13px; color: #b5bac1; }
  input { width: 100%; box-sizing: border-box; padding: 9px; border-radius: 6px; border: 1px solid #3f4147; background: #2b2d31; color: inherit; }
  .row { display: flex; gap: 8px; margin-top: 18px; }
  button { padding: 9px 16px; border: 0; border-radius: 6px; background: #5865f2; color: #fff; cursor: pointer; }
  button.secondary { background: #4e5058; }
  button:disabled { opacity: .5; cursor: default; }
  pre { background: #111214; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-word; font-size: 12px; }
  .ok { color: #57f287; } .err { color: #ed4245; }
</style>
</head>
<body>
  <h1>Discord Bot API Test</h1>

  <label for="token">Bot token</label>
  <input id="token" type="password" autocomplete="off">

  <label for="channel">Channel ID</label>
  <input id="channel" placeholder="Right-click a channel → Copy Channel ID">

  <label for="content">Message</label>
  <input id="content" value="hello">

  <div class="row">
    <button id="send">Send message</button>
    <button id="check" class="secondary">Check token</button>
  </div>

  <p id="status"></p>
  <pre id="output">No request yet.</pre>

<script>
  const $ = (id) => document.getElementById(id);
  for (const id of ["token", "channel"]) {
    $(id).value = localStorage.getItem("bottest_" + id) || "";
    $(id).addEventListener("input", () => localStorage.setItem("bottest_" + id, $(id).value));
  }

  async function call(path, payload) {
    const buttons = document.querySelectorAll("button");
    buttons.forEach((b) => (b.disabled = true));
    $("status").textContent = "Sending…";
    $("status").className = "";
    try {
      const res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      $("status").textContent = `Discord responded ${data.status} ${data.ok ? "— success" : "— failed"}`;
      $("status").className = data.ok ? "ok" : "err";
      $("output").textContent = JSON.stringify(data.body, null, 2);
    } catch (err) {
      $("status").textContent = "Could not reach the local server";
      $("status").className = "err";
      $("output").textContent = String(err);
    } finally {
      buttons.forEach((b) => (b.disabled = false));
    }
  }

  $("send").onclick = () =>
    call("/api/send", { token: $("token").value, channel_id: $("channel").value, content: $("content").value });
  $("check").onclick = () => call("/api/check", { token: $("token").value });
</script>
</body>
</html>
