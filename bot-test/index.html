<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Discord Bot Test</title>
<style>
  body { font-family: system-ui, sans-serif; background: #1e1f22; color: #dbdee1; max-width: 560px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 20px; }
  label { display: block; margin: 14px 0 4px; font-size: 13px; color: #b5bac1; }
  input { width: 100%; box-sizing: border-box; padding: 9px; border-radius: 6px; border: 1px solid #3f4147; background: #2b2d31; color: inherit; }
  button { margin-top: 18px; padding: 9px 16px; border: 0; border-radius: 6px; background: #5865f2; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  pre { background: #111214; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-word; font-size: 12px; }
  .ok { color: #57f287; } .err { color: #ed4245; }
</style>
</head>
<body>
  <h1>Discord Bot API Test</h1>

  <label for="token">Bot token</label>
  <input id="token" type="password" autocomplete="off" placeholder="Paste bot token here">

  <label for="channel">Channel ID</label>
  <input id="channel" placeholder="Paste channel ID here">

  <label for="content">Message</label>
  <input id="content" value="hello">

  <button id="send">Send message</button>

  <p id="status"></p>
  <pre id="output">No request yet.</pre>

<script>
  // Placeholders: put your values here to have them pre-filled, or paste them into the page.
  const BOT_TOKEN = "YOUR_BOT_TOKEN_HERE";
  const CHANNEL_ID = "YOUR_CHANNEL_ID_HERE";

  const $ = (id) => document.getElementById(id);
  if (!BOT_TOKEN.startsWith("YOUR_")) $("token").value = BOT_TOKEN;
  if (!CHANNEL_ID.startsWith("YOUR_")) $("channel").value = CHANNEL_ID;

  $("send").onclick = async () => {
    const token = $("token").value.trim();
    const channelId = $("channel").value.trim();
    $("send").disabled = true;
    $("status").textContent = "Sending…";
    $("status").className = "";
    try {
      const res = await fetch(`https://discord.com/api/v10/channels/${channelId}/messages`, {
        method: "POST",
        headers: { "Authorization": `Bot ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ content: $("content").value || "hello" }),
      });
      const body = await res.json().catch(() => null);
      $("status").textContent = `Discord responded ${res.status} ${res.ok ? "— message sent" : "— failed"}`;
      $("status").className = res.ok ? "ok" : "err";
      $("output").textContent = JSON.stringify(body, null, 2);
    } catch (err) {
      $("status").textContent = "Request blocked or network error (see console)";
      $("status").className = "err";
      $("output").textContent = String(err);
    } finally {
      $("send").disabled = false;
    }
  };
</script>
</body>
</html>
