<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OverShare</title>
  <style>
    :root {
      --bg: #1b1c22;
      --panel: #24252d;
      --panel-2: #2b2d36;
      --border: #3a3c47;
      --text: #e7e8ec;
      --muted: #9a9ca6;
      --accent: #5865f2;      /* Discord blurple */
      --accent-hover: #4752c4;
      --ok: #3ba55d;
      --err: #ed4245;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 360px;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      color-scheme: dark;
      scrollbar-width: thin;                     /* Firefox */
      scrollbar-color: var(--border) transparent;
    }
    /* Pin the popup just under Chrome's 600px cap so it never resizes */
    body { min-height: 596px; }
    /* Thin, subtle scrollbars (Chromium) — no chunky default gutter */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #565866; }
    header {
      display: flex; align-items: center; gap: 9px;
      padding: 11px 14px; background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    header .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 8px var(--accent);
    }
    header h1 { font-size: 15px; font-weight: 600; margin: 0; flex: 1; }
    header .version { font-size: 11px; font-weight: 600; color: var(--muted); }
    .iconbtn {
      background: none; border: none; cursor: pointer; padding: 0 2px;
      font-size: 15px; line-height: 1; opacity: 0.85;
    }
    .iconbtn:hover { opacity: 1; }

    main { padding: 14px; display: flex; flex-direction: column; gap: 9px; }

    label {
      display: block; font-size: 12px; color: var(--muted);
      margin-bottom: 4px; font-weight: 600; letter-spacing: 0.02em;
    }
    .row { display: flex; gap: 8px; align-items: flex-end; }
    .row > div { flex: 1; }

    input[type="text"], input[type="password"], input[type="number"], textarea {
      width: 100%; padding: 9px 12px;
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 13px;
      outline: none; transition: border-color 0.15s;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    input[type="number"]::-webkit-inner-spin-button { opacity: 0.6; }
    textarea { resize: none; overflow-y: hidden; max-height: 120px; line-height: 1.4; }

    button.mini {
      padding: 10px 12px; white-space: nowrap;
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      transition: border-color 0.15s;
    }
    button.mini:hover { border-color: var(--accent); }

    .tokenstatus { font-size: 11px; font-weight: 600; margin-top: 5px; }
    .tokenstatus::before { content: "● "; }
    .tokenstatus.ok { color: var(--ok); }
    .tokenstatus.bad { color: var(--err); }
    .tokenstatus.checking { color: var(--muted); }

    select.mini-select {
      padding: 9px 8px; background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 12px; font-weight: 600;
      cursor: pointer; max-width: 120px;
    }
    select.mini-select:hover { border-color: var(--accent); }

    /* Tabs */
    .tabs { display: flex; gap: 6px; background: var(--panel-2); padding: 4px; border-radius: 10px; }
    .tabs button {
      flex: 1; padding: 8px; border: none; border-radius: 7px;
      background: transparent; color: var(--muted);
      font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .tabs button.active { background: var(--accent); color: #fff; }

    .panel { display: none; flex-direction: column; gap: 9px; }
    .panel.active { display: flex; }

    .drop {
      border: 1.5px dashed var(--border); border-radius: 10px;
      padding: 13px; text-align: center; color: var(--muted);
      cursor: pointer; transition: border-color 0.15s, background 0.15s;
    }
    .drop:hover, .drop.drag { border-color: var(--accent); background: var(--panel-2); }
    .drop.has-file { color: var(--text); border-style: solid; border-color: var(--accent); }
    .drop .name { font-weight: 600; word-break: break-all; }
    .drop .size { font-size: 12px; color: var(--muted); margin-top: 4px; }
    input[type="file"] { display: none; }
    /* Drop zone and folder button side by side, same height */
    .pick { display: flex; gap: 8px; align-items: stretch; }
    .pick .drop { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .pick #folderBtn { width: 96px; flex-shrink: 0; white-space: normal; line-height: 1.3; }

    button.send {
      width: 100%; padding: 10px; background: var(--accent); color: #fff;
      border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
    }
    button.send:hover:not(:disabled) { background: var(--accent-hover); }
    button.send:disabled { opacity: 0.5; cursor: not-allowed; }
    /* While sending, the Send button becomes a red Cancel */
    button.send.cancel { background: var(--err); }
    button.send.cancel:hover:not(:disabled) { background: #c93b3e; }

    /* Controls locked during a send */
    input:disabled, textarea:disabled, select:disabled, button.mini:disabled { opacity: 0.5; cursor: not-allowed; }
    .drop.locked { opacity: 0.5; pointer-events: none; }

    .progress { height: 6px; background: var(--panel-2); border-radius: 4px; overflow: hidden; display: none; }
    .progress .bar { height: 100%; width: 0%; background: var(--accent); transition: width 0.2s; }

    .status { font-size: 12px; min-height: 16px; word-break: break-word; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    .status.info { color: var(--muted); }

    #chunkInfo { display: block; margin-top: 2px; }
    .hint { font-size: 11px; color: var(--muted); line-height: 1.5; }
    #chunkInfo, #channelName { color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; }
    #channelName { color: var(--accent); }

    /* Download list */
    .list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
    .item {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 12px; background: var(--panel-2);
      border: 1px solid var(--border); border-radius: 8px;
    }
    .item .meta { flex: 1; min-width: 0; }
    .item .fname { font-size: 13px; font-weight: 600; word-break: break-all; }
    .item .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .item .sub.incomplete { color: var(--err); }
    .item button {
      padding: 6px 12px; border: none; border-radius: 7px;
      background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .item button:hover:not(:disabled) { background: var(--accent-hover); }
    .item button:disabled { opacity: 0.4; cursor: not-allowed; }
    .empty { text-align: center; color: var(--muted); font-size: 12px; padding: 24px 0; }
  </style>
</head>
<body>
  <header>
    <span class="dot"></span>
    <h1>OverShare</h1>
    <span class="version" id="version"></span>
    <button class="iconbtn" id="mute" title="Mute sounds">🔊</button>
  </header>

  <main>
    <!-- Shared: auth + target (used by both tabs) -->
    <div>
      <label for="token">Account token</label>
      <input type="password" id="token" placeholder="auto-detected on Discord, or paste here" autocomplete="off" />
      <div id="tokenStatus" class="tokenstatus checking">Checking token…</div>
    </div>
    <div>
      <label for="channel">Channel / DM ID <span id="channelName"></span></label>
      <div class="row">
        <div><input type="text" id="channel" placeholder="e.g. 123456789012345678" autocomplete="off" /></div>
        <select id="knownChannels" class="mini-select" title="Saved channels"></select>
      </div>
    </div>

    <div class="tabs">
      <button id="tabSend" class="active">Send</button>
      <button id="tabDownload">Download</button>
    </div>

    <!-- SEND -->
    <section class="panel active" id="sendPanel">
      <div>
        <label>File or folder</label>
        <div class="pick">
          <div class="drop" id="drop"><div id="dropLabel">Click for a file, or drop a file / folder</div></div>
          <button class="mini" id="folderBtn">📁 Or pick a folder…</button>
        </div>
        <input type="file" id="file" />
        <input type="file" id="folder" webkitdirectory />
      </div>
      <div class="row">
        <div>
          <label for="chunk">Chunk size (MB)<span id="chunkInfo"></span></label>
          <input type="number" id="chunk" min="0.001" step="any" value="20" />
        </div>
        <div>
          <label for="maxmsg">Files / message</label>
          <input type="number" id="maxmsg" min="1" max="10" step="1" value="10" />
        </div>
      </div>
      <div>
        <label for="note">Message (optional)</label>
        <textarea id="note" rows="1" placeholder=""></textarea>
      </div>
      <div class="progress" id="progress"><div class="bar" id="bar"></div></div>
      <button class="send" id="send" disabled>Send file</button>
    </section>

    <!-- DOWNLOAD -->
    <section class="panel" id="downloadPanel">
      <div id="loadOlderWrap"></div>
      <div class="list" id="fileList"><div class="empty">Files from this channel will appear here.</div></div>
      <div class="progress" id="dlProgress"><div class="bar" id="dlBar"></div></div>
    </section>

    <div class="status info" id="status"></div>
  </main>

  <script src="fflate.js"></script>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
